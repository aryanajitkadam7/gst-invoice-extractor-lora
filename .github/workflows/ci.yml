name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: pip install transformers==5.19.0 peft==0.21.2
      - run: python -m pytest -q
